<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>三天 remotion — 编辑器</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    :root{--editor-sidebar-w:320px}
    body{height:100%;display:flex;flex-direction:column;overflow:hidden}

    /* ── Split layout (OD .split) ── */
    .split{display:grid;grid-template-columns:var(--editor-sidebar-w) 8px minmax(0,1fr);grid-template-areas:"sidebar handle workspace";min-height:0;min-width:0;max-width:100%;overflow:hidden;background:var(--bg);flex:1}
    .split[data-sidebar-side="right"]{grid-template-columns:minmax(0,1fr) 8px var(--editor-sidebar-w);grid-template-areas:"workspace handle sidebar"}
    .pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg-panel);overflow:hidden}
    .split-handle{position:relative;z-index:45;width:8px;min-width:8px;height:100%;cursor:col-resize;background:transparent;touch-action:none}
    .split-handle::before{content:"";position:absolute;top:0;bottom:0;left:-10px;right:-10px;cursor:col-resize}
    .split-handle::after{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 0.5px);width:1px;pointer-events:none;background:color-mix(in srgb,var(--border) 92%,transparent);opacity:.9;transition:background-color 140ms var(--ease-out),box-shadow 140ms var(--ease-out),opacity 140ms var(--ease-out)}
    .split-handle:hover::after,.split-handle:focus-visible::after,.split.is-resizing .split-handle::after{background:color-mix(in srgb,var(--accent) 70%,var(--border));box-shadow:none;opacity:1}
    .split-handle:focus-visible{outline:none}

    .editor-sidebar{grid-area:sidebar;container-type:inline-size;background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--border)}
    .split[data-sidebar-side="right"] .editor-sidebar{border-right:0;border-left:1px solid var(--border)}
    .split-handle{grid-area:handle}.workspace{grid-area:workspace}
    .sidebar-tabs{height:44px;display:grid;grid-template-columns:1fr 1fr;flex:0 0 auto;border-bottom:1px solid var(--border);background:var(--bg-panel)}
    .sidebar-tab{appearance:none;position:relative;border:0;background:transparent;color:var(--text-muted);font:inherit;font-size:12.5px;cursor:pointer}
    .sidebar-tab.is-active{color:var(--text-strong);font-weight:650}
    .sidebar-tab.is-active::after{content:"";position:absolute;left:28%;right:28%;bottom:-1px;height:2px;background:var(--accent)}
    .sidebar-view{flex:1;min-height:0;min-width:0}.sidebar-view[hidden]{display:none}
    .conversation-panel,.components-panel{display:flex;flex-direction:column;background:var(--bg)}
    /* ── Component panel (OD df-panel + db-reference patterns) ── */
    /* Search (OD db-reference-search) */
    .comp-search{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:34px;margin:12px 12px 0;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-panel);transition:border-color 140ms var(--ease-out),box-shadow 140ms var(--ease-out)}
    .comp-search:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
    .comp-search input{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--text);font-size:13px;outline:none}
    .comp-search input:focus{border:0;box-shadow:none}
    .comp-search input::placeholder{color:var(--text-soft)}
    .comp-search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
    .comp-search-clear{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--radius-sm);padding:2px;background:transparent;color:var(--text-soft);cursor:pointer;transition:background 140ms var(--ease-out),color 140ms var(--ease-out)}
    .comp-search-clear:hover{background:var(--bg-subtle);color:var(--text)}
    /* Chips (OD db-reference-chip) */
    .comp-chips{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none}
    .comp-chips::-webkit-scrollbar{display:none}
    .comp-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid color-mix(in srgb,var(--border) 88%,transparent);border-radius:var(--radius-pill);background:var(--bg-panel);color:var(--text-muted);padding:6px 13px;font-size:12.5px;font-weight:550;white-space:nowrap;cursor:pointer;transition:background 140ms var(--ease-out),border-color 140ms var(--ease-out),color 140ms var(--ease-out)}
    .comp-chip:hover{color:var(--text);border-color:var(--border-strong)}
    .comp-chip.is-active{border-color:color-mix(in srgb,var(--accent) 40%,var(--border));background:var(--accent-tint);color:var(--accent-strong)}
    .comp-chip-count{min-width:18px;text-align:center;border-radius:var(--radius-pill);padding:1px 6px;font-size:11px;font-weight:600;color:var(--text-soft);background:color-mix(in srgb,var(--border) 40%,transparent)}
    .comp-chip.is-active .comp-chip-count{color:var(--accent-strong);background:color-mix(in srgb,var(--accent) 18%,transparent)}
    /* Scrollable card grid */
    .comp-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
    /* Card (OD .home-hero__plugin-preset) */
    .comp-card{appearance:none;position:relative;flex:0 0 auto;width:calc(100% - 24px);margin:0 12px;min-width:0;display:grid;grid-template-rows:150px minmax(0,auto);gap:8px;padding:0;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-panel);color:var(--text);font:inherit;text-align:left;cursor:grab;box-shadow:var(--shadow-xs);overflow:hidden;transition:border-color 140ms var(--ease-out),background-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 140ms var(--ease-out),box-shadow 140ms var(--ease-out)}
    .comp-card:not(:disabled):hover,.comp-card:not(:disabled):focus-visible{border-color:color-mix(in srgb,var(--accent) 42%,var(--border));background:color-mix(in srgb,var(--accent-tint) 32%,var(--bg-panel));color:var(--text-strong);transform:translateY(-1px);box-shadow:var(--shadow-sm);outline:none}
    .comp-card:active{cursor:grabbing}
    .comp-card.dragging{cursor:grabbing;opacity:.55;transform:scale(1.02);box-shadow:var(--shadow-md)}
    .comp-card__preview{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg-subtle);border-bottom:1px solid color-mix(in srgb,var(--border) 72%,transparent)}
    .comp-card__preview .swatch{position:absolute;inset:0;display:flex}
    .comp-card__preview .swatch span{flex:1;min-width:0}
    .comp-card__body{padding:0 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
    .comp-card__title{min-width:0;font-size:12.5px;font-weight:650;color:var(--text);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .comp-card__desc{font-size:11px;color:var(--text-muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    /* ── Workspace (right pane) ── */
    .workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;background:var(--bg-app)}
    .export-toolbar{position:relative;z-index:40;display:flex;justify-content:flex-end;flex:0 0 auto;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg-panel)}
    .export-button,.export-cancel{appearance:none;height:32px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--bg-panel);color:var(--text);font:inherit;font-size:12px;font-weight:650;cursor:pointer}
    .export-button{border-color:var(--accent);background:var(--accent);color:white}
    .export-button:disabled,.export-cancel:disabled{opacity:.5;cursor:default}
    .export-popover{position:absolute;top:50px;right:16px;width:min(340px,calc(100vw - 32px));padding:14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-panel);box-shadow:var(--shadow-lg)}
    .export-popover[hidden]{display:none}
    .export-status{font-size:13px;font-weight:650;color:var(--text-strong)}
    .export-target{margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text-muted)}
    .export-progress{margin-top:7px;font-family:var(--mono);font-size:12px;color:var(--accent)}
    .export-cancel{margin-top:12px}
    .ws-scroll{flex:1;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 24px 0;overflow-y:auto;min-height:0;scrollbar-width:thin}

    /* ── Video preview ── */
    .preview{width:100%;max-width:800px;aspect-ratio:16/9;background:#000;border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;overflow:hidden;box-shadow:var(--shadow-xs);flex-shrink:0}
    .preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
    .preview.has-video video{display:block}
    #remotionPreview{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1}
    #remotionPreview[hidden]{display:none}
    #previewArea[data-render-engine="remotion"]>#previewVideo{display:none}
    #remotionPreviewMessage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;color:var(--text-muted);font-size:12px;background:var(--bg-panel)}
    #remotionPreviewMessage[hidden]{display:none}
    #previewSourceCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:1}
    #previewSourceCanvas[hidden]{display:none}
    #previewLayerCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:2}
    #previewLayerCanvas[hidden]{display:none}
    .preview.has-video .preview__overlay{opacity:0;transition:opacity 200ms var(--ease-out)}
    .preview.has-video:hover .preview__overlay,.preview.has-video.paused .preview__overlay{opacity:1}
    .preview__overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
    .preview__icon{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:var(--bg-panel);display:grid;place-items:center;color:var(--text-muted);font-size:20px;box-shadow:var(--shadow-sm);cursor:pointer;pointer-events:auto}
    .preview__name{font-size:14px;font-weight:650;color:var(--text-strong);position:relative;z-index:3}
    .preview__meta{font-size:12px;color:var(--text-muted);position:relative;z-index:3}
    .preview__placeholder{color:var(--text-soft);font-size:13px;position:relative;z-index:3}
    .preview__upload{appearance:none;display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--bg-panel);color:var(--text);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;box-shadow:var(--shadow-xs);transition:all var(--dur-quick) var(--ease-out);position:relative;z-index:3}
    .preview__upload:hover{border-color:var(--border-strong);color:var(--accent);background:var(--bg-subtle);transform:translateY(-0.5px);box-shadow:var(--shadow-sm)}
    .preview-subtitle{position:absolute;left:50%;bottom:7%;z-index:3;max-width:84%;
      transform:translateX(-50%);padding:6px 10px;border-radius:var(--radius-sm);
      background:rgba(0,0,0,.72);color:#fff;font-size:16px;line-height:1.45;
      text-align:center;pointer-events:none}
    .preview-subtitle[hidden]{display:none}

    /* ── Timeline ── */
    .timeline{width:100%;max-width:800px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
    .tl-head{display:flex;align-items:center;gap:6px}
    .tl-btn{appearance:none;width:28px;height:28px;flex:0 0 auto;padding:0;border:1px solid transparent;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:12px;transition:background-color 140ms var(--ease-out),color 140ms var(--ease-out),border-color 140ms var(--ease-out)}
    .tl-btn:hover,.tl-btn.is-active{background:var(--bg-subtle);border-color:var(--border-strong);color:var(--text)}
    .tl-btn--wider{width:auto;padding:0 6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
    .tl-vol-slider{-webkit-appearance:none;appearance:none;width:64px;height:4px;border-radius:2px;background:var(--border-strong);outline:none;cursor:pointer}
    .tl-vol-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-panel);box-shadow:var(--shadow-sm);cursor:pointer}
    .tl-vol-slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-panel);box-shadow:var(--shadow-sm);cursor:pointer;border-color:var(--bg-panel)}
    .tl-label{font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em}
    .tl-viewport{width:100%;min-width:0;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-panel);box-shadow:var(--shadow-xs);box-sizing:border-box}
    .tl-track{position:relative;height:58px;background:var(--bg-panel);cursor:pointer;user-select:none}
    .tl-zoom{margin-left:auto;display:flex;gap:2px;flex-shrink:0}
    .tl-btn:disabled{opacity:.35;cursor:default}
    .tl-ruler{position:sticky;top:0;height:28px;background:var(--bg-panel);border-bottom:1px solid var(--border);z-index:8;box-sizing:border-box}
    .tl-ruler-tick{position:absolute;top:7px;height:21px;border-left:1px solid var(--border);padding-left:4px;color:var(--text-faint);font-family:var(--mono);font-size:10px;white-space:nowrap}
    .tl-ruler-tick.is-last{transform:translateX(-100%);border-left:0;border-right:1px solid var(--border);padding-right:4px}
    .tl-row{position:absolute;left:0;right:0;height:30px;box-sizing:border-box}
    .tl-lane-divider{border-top:1px solid var(--border-strong)}
    .tl-row-label,.tl-ruler-label{display:none}
    .tl-line{position:absolute;left:16px;right:16px;height:2px;background:var(--border-strong);border-radius:1px}
    .tl-ticks{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between}
    .tl-tick{width:1px;height:8px;background:var(--border-strong);opacity:.6}
    .tl-playhead{position:absolute;top:28px;bottom:0;width:2px;background:var(--accent);border-radius:1px;z-index:5;pointer-events:none}
    .tl-playhead::before{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:14px;height:14px;background:var(--accent);border-radius:50%;border:2px solid var(--bg-panel);box-shadow:var(--shadow-sm)}
    .tl-time{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);font-family:var(--mono);padding:0 16px}
    /* Timeline markers */
    .tl-marker,.tl-source{position:absolute;top:4px;height:22px;box-sizing:border-box;overflow:hidden;z-index:3;display:inline-flex;align-items:center;padding:2px 0;text-indent:6px;border-radius:var(--radius-sm);font-size:10px;font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:inset 0 0 0 1px var(--accent),var(--shadow-xs);background:var(--accent-tint);color:var(--text-strong);border:0}
    .tl-source{background:var(--bg-subtle);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--text-muted)}
    .tl-marker:hover{z-index:4}
    .tl-track.drag-over-tl{background:color-mix(in srgb,var(--accent-tint) 20%,var(--bg-panel));border-color:color-mix(in srgb,var(--accent) 42%,var(--border))}
    .subtitle-section{width:100%;max-width:800px;display:grid;grid-template-columns:42px minmax(0,1fr);gap:6px 8px;
      align-items:center}
    .subtitle-track-label{font-size:11px;color:var(--text-muted)}
    .subtitle-track{position:relative;height:34px;overflow:hidden;border:1px solid var(--border);
      border-radius:var(--radius-sm);background:var(--bg-panel)}
    .subtitle-block{position:absolute;top:4px;height:24px;overflow:hidden;padding:0 6px;
      border:1px solid color-mix(in srgb,var(--accent) 45%,var(--border));
      border-radius:var(--radius-sm);background:var(--accent-tint);color:var(--text-strong);
      font:inherit;font-size:10px;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
    .request-undo{height:30px;padding:0 10px;border:1px solid var(--border);
      border-radius:var(--radius-pill);background:var(--bg-panel);color:var(--text);
      font:inherit;font-size:11px;cursor:pointer}
    .subtitle-document{margin:10px 0 2px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-panel);overflow:hidden}
    .subtitle-document[hidden]{display:none}
    .subtitle-document__head{display:flex;align-items:flex-start;gap:8px;padding:10px 11px}
    .subtitle-document__title{flex:1;min-width:0;padding:3px 0;color:var(--text-strong);font-size:12px;font-weight:650;text-align:left;background:none;border:0;cursor:pointer}
    .subtitle-document__draft-marker{padding:3px 0;color:var(--text-muted);font-size:10.5px;white-space:nowrap}
    .subtitle-document__actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .subtitle-document__actions button{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--bg-panel);color:var(--text);font:inherit;font-size:11px;cursor:pointer}
    .subtitle-document__actions button:disabled{opacity:.5;cursor:default}
    .subtitle-document__status{padding:0 11px 10px;color:var(--text-muted);font-size:11px}
    .subtitle-document__surface{max-height:300px;overflow:auto;border-top:1px solid var(--border);padding:7px 11px 10px}
    .subtitle-document.is-collapsed .subtitle-document__actions,.subtitle-document.is-collapsed .subtitle-document__status{display:none}
    .subtitle-document__segment{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.5}
    .subtitle-document__segment:last-child{border-bottom:0}
    .subtitle-document__time{color:var(--text-muted);font-size:10px;padding-top:2px}
    .subtitle-document__text{min-width:0;outline:none;white-space:pre-wrap;color:var(--text)}
    .subtitle-document__text:focus{color:var(--text-strong)}
    .subtitle-document__error{grid-column:2;color:var(--red);font-size:10.5px}
    @container (max-width:260px){.subtitle-document__head{flex-wrap:wrap}.subtitle-document__title{flex-basis:100%}.subtitle-document__actions{width:100%}.subtitle-document__segment{grid-template-columns:1fr}.subtitle-document__time{padding:0}.subtitle-document__error{grid-column:1}}
    .request-result{margin-top:5px;font-size:10.5px;color:var(--text-muted)}
    .request-undo{margin-top:7px}
    .request-status-row[data-state="generating"] .request-status-icon{border:2px solid var(--border);
      border-top-color:var(--accent);background:transparent}

    /* ── Chat (OD chat-log + msg) ── */
    .chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:14px 12px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text-muted) 18%,transparent) transparent}
    .chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:12.5px;padding:40px 0}
    .msg{padding:0;background:transparent;border:none;white-space:normal;word-wrap:break-word;min-width:0;max-width:100%;animation:msgIn 200ms cubic-bezier(0.23,1,0.32,1) both}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .msg .role{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:600;color:var(--text-strong);margin-bottom:8px;letter-spacing:0;text-transform:none}
    .msg .role.user{color:var(--text-muted)}
    .msg-text{font-size:14.5px;color:var(--text);line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
    .msg.user{display:flex;flex-direction:column;align-items:flex-end;max-width:min(78%,560px);align-self:flex-end}
    .msg.user .msg-text{background:var(--bg-fill-tertiary);border:none;border-radius:var(--radius-lg);padding:8px 12px}
    .msg-time{font-size:11px;color:var(--text-faint);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:8px}

    .request-user-message{align-self:flex-end;max-width:78%;padding:8px 11px;border-radius:12px 12px 3px 12px;background:var(--accent);color:white;font-size:12.5px;line-height:1.45}
    .request-status-card{padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-panel);box-shadow:var(--shadow-xs)}
    .request-status-summary{width:100%;padding:2px 0;border:0;background:none;color:var(--text-strong);font:inherit;font-size:11.5px;font-weight:650;text-align:left;cursor:pointer}
    .request-status-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:11.5px;font-weight:650;color:var(--text-strong)}
    .request-status-time{font-size:10px;font-weight:400;color:var(--text-faint)}
    .request-status-row{min-height:27px;display:grid;grid-template-columns:17px minmax(0,1fr) auto;align-items:center;gap:6px;font-size:11px;color:var(--text-muted)}
    .request-status-row + .request-status-row{border-top:1px solid var(--border-soft)}
    .request-status-icon{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;background:var(--bg-subtle);color:var(--text-muted);font-size:9px;font-weight:700}
    .request-status-row[data-state="converting"] .request-status-icon,.request-status-row[data-state="applying"] .request-status-icon{border:2px solid var(--border);border-top-color:var(--accent);background:transparent}
    .request-status-row[data-state="success"] .request-status-icon{background:color-mix(in srgb,var(--green) 14%,var(--bg-panel));color:var(--green)}
    .request-status-row[data-state="failed"] .request-status-icon{background:color-mix(in srgb,var(--red) 12%,var(--bg-panel));color:var(--red)}
    .request-status-value{font-size:10.5px;color:var(--text-muted)}
    .request-status-row[data-state="success"] .request-status-value{color:var(--green)}
    .request-status-row[data-state="failed"] .request-status-value{color:var(--red)}
    .request-error{margin-top:6px;padding-top:7px;border-top:1px solid var(--border-soft);color:var(--red);font-size:10.5px;line-height:1.4}

    /* ── Input card ── */
    .input-card{position:relative;z-index:2;width:auto;max-width:none;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:none;padding:10px;display:flex;flex-direction:column;gap:10px;margin:0 12px 12px;transition:border-color 120ms var(--ease-out),box-shadow 120ms var(--ease-out);flex-shrink:0}
    .input-card:focus-within{border-color:color-mix(in srgb,var(--accent) 40%,var(--border));box-shadow:none}
    .input-editor{min-height:48px;padding:8px 4px;font-size:14px;color:var(--text-strong);outline:none;line-height:1.55;word-break:break-word}
    .input-editor:empty::before{content:attr(data-placeholder);color:var(--text-soft);pointer-events:none}
    .input-foot{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:0;padding-top:8px}
    .input-foot-l{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;flex-wrap:nowrap;overflow:visible}
    .input-foot-l strong{color:var(--text-strong);font-weight:650}
    .input-foot-r{display:flex;align-items:center;gap:8px;flex:0 0 auto}
    .input-submit{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:64px;height:32px;padding:0 16px;border-radius:var(--radius-pill);border:1px solid var(--accent);background:var(--accent);color:white;box-shadow:var(--shadow-xs);cursor:pointer;font:inherit;font-size:12.5px;font-weight:650;line-height:1;transition:background-color 140ms cubic-bezier(0.23,1,0.32,1),border-color 140ms cubic-bezier(0.23,1,0.32,1),box-shadow 140ms cubic-bezier(0.23,1,0.32,1),transform 140ms cubic-bezier(0.23,1,0.32,1),opacity 140ms cubic-bezier(0.23,1,0.32,1)}
    .input-submit:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:var(--shadow-sm)}
    .input-submit:active:not(:disabled){transform:translateY(1px);box-shadow:var(--shadow-xs)}
    .input-submit:disabled{opacity:.5;cursor:default;box-shadow:none}
    .skill-context-row{display:flex;align-items:center;gap:7px;min-height:0;flex-wrap:wrap}
    .skill-context-row:empty{display:none}
    .selected-skill{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 9px;border:1px solid color-mix(in srgb,var(--accent) 38%,var(--border));border-radius:var(--radius-pill);background:var(--accent-tint);color:var(--accent-strong);font-size:11.5px}
    .selected-skill[hidden],.skill-exit-clarify[hidden]{display:none}
    .selected-skill__name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .selected-skill__clear{appearance:none;border:0;background:transparent;color:inherit;font:inherit;line-height:1;cursor:pointer;padding:0 1px}
    .selected-skill__clear:disabled{opacity:.45;cursor:default}
    .personal-skills-button,.skill-exit-clarify,.save-as-skill,.skill-button{appearance:none;height:29px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--bg-panel);color:var(--text);font:inherit;font-size:11px;cursor:pointer}
    .personal-skills-button:disabled,.skill-button:disabled{opacity:.48;cursor:default}
    .project-media-row{display:flex;gap:6px;align-items:center;margin:6px 0;font-size:11px;color:var(--text-soft)}
    .project-media-row[hidden]{display:none}
    .project-media-row select{min-width:0;flex:1;padding:5px;border:1px solid var(--border);border-radius:6px;background:var(--bg-panel);color:var(--text);font:inherit}
    .project-media-status{font-size:11px;line-height:1.4;color:var(--text-soft);margin:4px 0}
    .save-as-skill{margin-top:7px}
    .skill-dialog{width:min(430px,calc(100vw - 32px));max-height:min(620px,calc(100vh - 32px));padding:0;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-panel);color:var(--text);box-shadow:var(--shadow-lg)}
    .skill-dialog::backdrop{background:rgba(0,0,0,.28)}
    .skill-dialog__body{display:flex;flex-direction:column;gap:12px;padding:18px;max-height:inherit;overflow:auto}
    .skill-dialog__head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .skill-dialog__title{font-size:14px;font-weight:650;color:var(--text-strong)}
    .skill-dialog__close{appearance:none;border:0;background:transparent;color:var(--text-muted);font:inherit;font-size:12px;cursor:pointer}
    .skill-dialog__empty,.skill-dialog__error{font-size:11.5px;line-height:1.5;color:var(--text-muted)}
    .skill-dialog__error{color:var(--red)}
    .skill-list{display:flex;flex-direction:column;gap:9px}
    .skill-item{padding:11px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg)}
    .skill-item__head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .skill-item__name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:650;color:var(--text-strong)}
    .skill-item__actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
    .skill-item__details{margin-top:9px;padding-top:9px;border-top:1px solid var(--border-soft);display:grid;gap:7px;font-size:11.5px;line-height:1.5;color:var(--text-muted);white-space:pre-wrap;overflow-wrap:anywhere}
    .skill-item__details[hidden]{display:none}
    .skill-item__details strong{color:var(--text-strong);font-weight:650}
    .skill-form-field{display:grid;gap:6px;font-size:11.5px;color:var(--text-muted)}
    .skill-form-field input,.skill-form-field textarea{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--text-strong);font:inherit;font-size:12.5px;padding:8px 9px;outline:none;resize:vertical}
    .skill-form-field input:focus,.skill-form-field textarea:focus{border-color:color-mix(in srgb,var(--accent) 48%,var(--border))}
    .skill-dialog__actions{display:flex;justify-content:flex-end;gap:7px}
    .skill-button--primary{border-color:var(--accent);background:var(--accent);color:white}

    @media(max-width:560px){.ws-scroll{padding:16px 16px 0}.preview,.timeline{max-width:100%}.input-card{margin:0 10px 10px}.chat{padding:12px 10px}}
  </style>
</head>
<body>

  <div class="tabs-chrome" id="tabsBar" role="tablist" aria-label="页面标签"></div>

  <div class="split" id="splitRoot" data-sidebar-side="left">
    <aside class="pane editor-sidebar" id="editorSidebar" data-testid="editor-sidebar">
      <div class="sidebar-tabs" id="sidebarTabs" role="tablist" aria-label="编辑器侧栏">
        <button class="sidebar-tab is-active" data-testid="sidebar-tab-conversation"
          data-sidebar-tab="conversation" type="button" role="tab"
          aria-selected="true" aria-controls="conversationPanel">对话</button>
        <button class="sidebar-tab" data-testid="sidebar-tab-components"
          data-sidebar-tab="components" type="button" role="tab"
          aria-selected="false" aria-controls="componentsPanel">组件</button>
      </div>
      <section class="sidebar-view conversation-panel" id="conversationPanel"
        data-testid="conversation-panel" role="tabpanel">
        <div class="chat" id="chatArea" data-od-id="chat-history">
          <div class="chat-empty" id="chatEmpty">输入效果描述，开始对话</div>
          <section class="subtitle-document" data-subtitle-document data-testid="subtitle-document" hidden>
            <div class="subtitle-document__head">
              <button class="subtitle-document__title" type="button" data-testid="subtitle-document-toggle"></button>
              <span class="subtitle-document__draft-marker" data-testid="subtitle-document-draft-marker" hidden></span>
              <div class="subtitle-document__actions">
                <button type="button" data-testid="subtitle-document-save">保存</button>
                <button type="button" data-testid="subtitle-document-apply">应用</button>
              </div>
            </div>
            <div class="subtitle-document__status" data-testid="subtitle-document-status"></div>
            <div class="subtitle-document__surface" data-testid="subtitle-document-surface"></div>
          </section>
        </div>

        <div class="input-card">
          <div class="skill-context-row">
            <span class="selected-skill" data-testid="selected-skill" hidden>
              <span>技能</span><span class="selected-skill__name"></span>
              <button class="selected-skill__clear" data-testid="selected-skill-clear" type="button" aria-label="清除所选技能">×</button>
            </span>
            <button class="skill-exit-clarify" data-testid="skill-exit-clarify" type="button" hidden>退出本次补充</button>
          </div>
          <div class="input-editor" contenteditable="true" data-placeholder="描述要给视频加什么效果…" aria-label="效果描述输入" role="textbox" aria-multiline="true"></div>
          <label class="project-media-row" data-project-media-row hidden>参考素材
            <select data-testid="project-media-select" aria-label="本次参考素材"><option value="">不指定，由 AI 按需求选择</option></select>
          </label>
          <div class="project-media-status" data-testid="project-media-status" role="status" hidden></div>
          <div class="input-foot">
            <div class="input-foot-l"><button class="personal-skills-button" data-testid="personal-skills-button" type="button">我的技能</button><button class="personal-skills-button" data-testid="project-media-import" type="button">导入素材</button></div>
            <div class="input-foot-r">
              <button class="input-submit" id="generateBtn">生成效果 →</button>
            </div>
          </div>
        </div>
      </section>
      <section class="sidebar-view components-panel" id="componentsPanel"
        data-testid="components-panel" role="tabpanel" hidden>
      <div class="comp-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;opacity:.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="compSearch" placeholder="搜索组件…" />
        <button class="comp-search-clear" id="compSearchClear" style="display:none" aria-label="清除搜索">×</button>
      </div>
      <div class="comp-chips" id="compChips">
        <button class="comp-chip is-active" data-cat="入场">入场<span class="comp-chip-count">4</span></button>
        <button class="comp-chip" data-cat="退场">退场<span class="comp-chip-count">3</span></button>
        <button class="comp-chip" data-cat="文字">文字<span class="comp-chip-count">4</span></button>
        <button class="comp-chip" data-cat="背景">背景<span class="comp-chip-count">4</span></button>
        <button class="comp-chip" data-cat="卡片">卡片<span class="comp-chip-count">3</span></button>
        <button class="comp-chip" data-cat="Glam">Glam<span class="comp-chip-count">6</span></button>
      </div>
      <div class="comp-body" id="compBody"></div>
      </section>
    </aside>

    <!-- Resize handle (OD .split-resize-handle) -->
    <div class="split-handle" id="splitHandle"></div>

    <!-- Right: Workspace -->
    <main class="pane workspace" data-testid="editor-page">
      <div class="export-toolbar">
        <button class="export-button" type="button" data-testid="video-export-button">导出视频</button>
        <section class="export-popover" data-testid="video-export-popover" aria-live="polite" hidden>
          <div class="export-status" data-testid="video-export-status"></div>
          <div class="export-target" data-testid="video-export-target" hidden></div>
          <div class="export-progress" data-testid="video-export-progress" hidden></div>
          <button class="export-cancel" type="button" data-testid="video-export-cancel">取消导出</button>
        </section>
      </div>
      <div class="ws-scroll">
        <div class="preview" id="previewArea" data-od-id="video-preview">
          <video id="previewVideo" playsinline></video>
          <div id="remotionPreview" data-state="idle" hidden></div>
          <div id="remotionPreviewMessage" role="status" hidden></div>
          <canvas id="previewSourceCanvas" aria-hidden="true" hidden></canvas>
          <canvas id="previewLayerCanvas" data-testid="preview-layer-canvas" aria-hidden="true" hidden></canvas>
          <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
            <defs><filter id="previewColorFilter" color-interpolation-filters="sRGB"></filter></defs>
          </svg>
          <div class="preview-subtitle" id="previewSubtitle" data-testid="preview-subtitle" hidden></div>
          <div class="preview__overlay" id="previewOverlay" style="display:none">
            <div class="preview__icon" id="playBtn">▶</div>
          </div>
          <div class="preview__placeholder" id="previewPlaceholder">拖入视频素材，或点击下方按钮上传</div>
          <div class="preview__name" id="previewName" style="display:none"></div>
          <div class="preview__meta" id="previewMeta" style="display:none"></div>
          <button class="preview__upload" id="previewUpload" type="button" onclick="document.getElementById('reupload').click()">选择视频文件</button>
        </div>

        <div class="timeline" data-od-id="timeline">
          <div class="tl-head"><button class="tl-btn" id="tlPlayBtn" type="button" title="播放/暂停">▶</button><button class="tl-btn tl-btn--wider" id="tlSpeedBtn" type="button" title="播放速度">1×</button><button class="tl-btn" id="tlVolBtn" type="button" title="静音/取消静音">🔊</button><input type="range" class="tl-vol-slider" id="tlVolSlider" min="0" max="100" value="100" title="音量" /><div class="tl-label">时间轴</div><div class="tl-zoom"><button class="tl-btn" id="tlZoomOut" type="button" aria-label="缩小时间轴" disabled>−</button><button class="tl-btn" id="tlZoomIn" type="button" aria-label="放大时间轴" disabled>＋</button><button class="tl-btn tl-btn--wider" id="tlFit" type="button" disabled>显示全片</button></div></div>
          <div class="tl-viewport" id="tlViewport" tabindex="0" aria-label="分轨时间轴，可横向和纵向滚动">
            <div class="tl-track" id="tlTrack">
              <div class="tl-ruler" id="tlRuler"></div>
              <div class="tl-playhead" id="tlPlayhead" hidden></div>
            </div>
          </div>
          <div class="tl-time"><span id="tlCurrent">00:00</span><span id="tlTotal">03:20</span></div>
        </div>

        <section class="subtitle-section" data-testid="subtitle-section">
          <div class="subtitle-track-label">字幕</div>
          <div class="subtitle-track" id="subtitleTrack" data-testid="subtitle-track"></div>
        </section>

      </div>
    </main>
  </div>

  <dialog class="skill-dialog" data-testid="personal-skills-dialog" aria-labelledby="personalSkillsTitle">
    <div class="skill-dialog__body">
      <div class="skill-dialog__head">
        <div class="skill-dialog__title" id="personalSkillsTitle">我的技能</div>
        <button class="skill-dialog__close" type="button" data-skill-dialog-close>关闭</button>
      </div>
      <div class="skill-dialog__error" data-skill-list-error hidden></div>
      <div class="skill-dialog__empty" data-skill-list-empty>还没有保存技能</div>
      <div class="skill-list" data-skill-list></div>
    </div>
  </dialog>

  <dialog class="skill-dialog" data-testid="skill-save-dialog" aria-labelledby="skillSaveTitle">
    <form class="skill-dialog__body" data-skill-save-form>
      <div class="skill-dialog__head">
        <div class="skill-dialog__title" id="skillSaveTitle">保存为技能</div>
      </div>
      <label class="skill-form-field">名称
        <input data-testid="skill-name" maxlength="60" autocomplete="off" />
      </label>
      <label class="skill-form-field">剪辑意图
        <textarea data-testid="skill-intent" rows="6" maxlength="4000"></textarea>
      </label>
      <label class="skill-form-field">偏好
        <textarea data-testid="skill-preferences" rows="4" maxlength="2000"></textarea>
      </label>
      <div class="skill-dialog__error" data-skill-save-error hidden></div>
      <div class="skill-dialog__actions">
        <button class="skill-button" data-testid="skill-cancel" type="button">取消</button>
        <button class="skill-button skill-button--primary" data-testid="skill-save" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="reupload" accept="video/*" style="display:none" />

  <script src="shared.js"></script>
  <script src="components-data.js"></script>
  <script src="editor-playback.js"></script>
  <script src="editor-core.js"></script>
  <script src="../src/render-recipe.js"></script>
  <script src="../src/color-adjustment.js"></script>
  <script src="../src/video-transform.js"></script>
  <script src="../src/video-texture.js"></script>
  <script src="../src/visual-layers.js"></script>
  <script src="../src/visual-media.js"></script>
  <script src="../src/keyframes.js"></script>
  <script src="../src/visual-group.js"></script>
  <script src="../src/remotion-support.js"></script>
  <script src="../src/edit-capabilities.js"></script>
  <script src="../src/personal-skills.js"></script>
  <script src="../src/render-graph.js"></script>
  <script src="../src/remotion-input.js"></script>
  <script src="remotion-built/player.js"></script>
  <script src="../src/project-editing.js"></script>
  <script src="subtitle-draft-state.js"></script>
  <script src="editor-project-editing.js"></script>
  <script src="editor-assets.js"></script>
  <script src="editor-color-preview.js"></script>
  <script src="editor-source-preview.js"></script>
  <script src="editor-layer-preview.js"></script>
  <script src="editor-subtitles.js"></script>
  <script src="../src/transcript-context.js"></script>
  <script src="../src/timeline-layout.js"></script>
  <script src="editor-timeline-view.js"></script>
  <script src="editor-timeline.js"></script>
  <script src="editor-skills.js"></script>
  <script src="editor-export.js"></script>
  <script>
    window.__PAGE = { id: 'editor' };
    renderTabs();
  </script>
</body>
</html>
